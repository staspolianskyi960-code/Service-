<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Склад запчастин</title>
<meta name="theme-color" content="#1f3a52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Склад">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: parts counter — stock summary strip, search+scan bar, list of bin-tagged rows, bottom sheet for one part */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2530; --muted:#5d6b7a; --line:#d5dce3;
  --accent:#e2621b; --accent-ink:#ffffff; --tag:#1f3a52; --tag-ink:#e8f0f7;
  --ok:#2f7d4f; --warn:#b7791f; --bad:#c2372f; --soft:#f6f8fa;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --panel:#1b232b; --ink:#e6ebf0; --muted:#94a3b3; --line:#2c3743;
  --accent:#f07a36; --accent-ink:#1a0f08; --tag:#2d4d69; --tag-ink:#e8f0f7;
  --ok:#5cc08a; --warn:#e0a84a; --bad:#ef6a60; --soft:#222c36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#1b232b; --ink:#e6ebf0; --muted:#94a3b3; --line:#2c3743;
  --accent:#f07a36; --accent-ink:#1a0f08; --tag:#2d4d69; --tag-ink:#e8f0f7;
  --ok:#5cc08a; --warn:#e0a84a; --bad:#ef6a60; --soft:#222c36; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:16px;padding-block:18px 96px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-size:2rem;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.alert b{color:var(--bad)}
.bar{display:flex;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5}
.scan{white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-radius:0;border-left:0;border-right:0;border-top:0;text-align:left;font-weight:400;width:100%}
.row:last-child{border-bottom:0}
.bin{font-family:var(--f-mono);font-size:.75rem;background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:4px 6px;min-width:52px;text-align:center}
.bin.none{background:var(--soft);color:var(--muted)}
.info{min-width:0}
.pn{font-family:var(--f-mono);font-size:.95rem;overflow-wrap:anywhere}
.nm{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.qty small{display:block;font-family:var(--f-body);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.qty.low{color:var(--warn)} .qty.out{color:var(--bad)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1 1 140px}
.note{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-size:1.5rem;margin:0;text-transform:uppercase;letter-spacing:.02em}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.close{padding:8px 12px}
.big{display:flex;align-items:center;justify-content:center;gap:14px}
.big .n{font-family:var(--f-display);font-size:3.4rem;min-width:90px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.big button{font-size:1.6rem;width:64px;height:64px;padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label,.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.hist{font-size:.85rem;display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
.hist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px;font-variant-numeric:tabular-nums}
.plus{color:var(--ok)} .minus{color:var(--bad)}
.confirm{background:var(--soft);border:1px solid var(--bad);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.preview{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;font-size:.8rem}
.preview table{border-collapse:collapse;width:100%}
.preview td,.preview th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.stat b{font-size:1.5rem}}
.vinbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.carchip{display:inline-flex;align-items:center;gap:8px;background:var(--tag);color:var(--tag-ink);border-radius:999px;padding:6px 6px 6px 12px;font-size:.85rem;min-width:0;max-width:100%}
.carchip button{padding:2px 8px;border-radius:999px;font-size:.8rem;background:transparent;color:var(--tag-ink);border-color:var(--tag-ink)}
.car{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.car .title{font-family:var(--f-display);font-size:1.4rem;text-transform:uppercase;letter-spacing:.02em}
.fit{font-size:.78rem;color:var(--ok);font-weight:600}
.sec{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.8rem;color:var(--muted);font-weight:500;gap:2px}
.ph.add b{font-size:1.6rem;line-height:1;color:var(--accent)}
.bigimg{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:var(--soft)}
.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px)}}}

.cam{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.aim{position:absolute;left:8%;right:8%;top:38%;bottom:38%;border:2px solid var(--accent);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.chip.pn{font-family:var(--f-mono)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Склад запчастин</h1>
    <p class="sub" id="status">Завантаження…</p>
  </header>

  <section class="stats" aria-label="Підсумок">
    <div class="stat"><b id="sPos">0</b><span>позицій</span></div>
    <div class="stat"><b id="sUnits">0</b><span>штук</span></div>
    <div class="stat" id="sLowBox"><b id="sLow">0</b><span>закінчуються</span></div>
  </section>

  <div class="bar">
    <input id="q" type="search" placeholder="Номер, назва або полиця" autocomplete="off">
    <button class="primary scan" id="scanBtn">Сканувати</button>
  </div>
  <div class="vinbar">
    <button id="vinBtn">Пошук по VIN</button>
    <span id="carChip" class="carchip" hidden></span>
  </div>
  <input id="scanFile" type="file" accept="image/*" hidden>
  <input id="photoFile" type="file" accept="image/*" multiple hidden>

  <div class="filters" role="group" aria-label="Фільтр">
    <button class="chip" data-f="all" aria-pressed="true">Усі</button>
    <button class="chip" data-f="low" aria-pressed="false">Закінчуються</button>
    <button class="chip" data-f="out" aria-pressed="false">Немає</button>
  </div>

  <div class="list" id="list"></div>

  <div class="actions">
    <button id="addBtn">+ Нова запчастина</button>
    <button id="importBtn">Імпорт з Екселя</button>
  </div>
  <input id="xlsFile" type="file" accept=".xlsx,.xls,.csv" hidden>
  <div class="actions">
    <button id="exportBtn">Зберегти копію в Ексель</button>
  </div>
  <p class="note">«Сканувати» вмикає камеру: наведіть на штрихкод, і він прочитається сам. Якщо штрихкоду немає, натисніть «З фото» — програма розпізнає текст із фотографії.</p>
</div>

<div id="toast" class="toast" hidden></div>
<div id="scrim" class="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
